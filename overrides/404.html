{% extends "main.html" %}
{% block content %}
{% set heading = 'Page not found' %}
<div class="wrap page-pad error-page" style="--title-chars: {{ title_chars(heading) }}">
  <p class="error-code">404</p>
  <h1>{{ heading }}</h1>
  <p class="dek">The address may have changed. View the <a href="{{ 'technical-labs/' | url }}">projects</a> or return home.</p>
  <p class="error-action"><a class="button" href="{{ nav.homepage.url | url }}">Back to home</a></p>
</div>
{% endblock %}
