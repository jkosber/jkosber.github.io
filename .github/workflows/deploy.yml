name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install verified build dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check content accessibility hooks
        run: python -m unittest discover -s tests

      - name: Deploy to GitHub Pages
        env:
          GIT_COMMITTER_NAME: Jadon Kosberg
          GIT_COMMITTER_EMAIL: jkosber@users.noreply.github.com
        run: |
          python -m mkdocs gh-deploy --strict --force
