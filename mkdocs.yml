site_name: Jadon Kosberg
site_url: https://jnkos.com/
site_author: Jadon Kosberg
site_description: IT support experience and evidence-backed projects in infrastructure, networking and cybersecurity by Jadon Kosberg.

theme:
  name: material
  custom_dir: overrides
  font: false

# Small custom layout with ordinary links; no search bundle is needed.
plugins: []
hooks:
  - hooks/asset_versions.py
  - hooks/tool_icons.py
  - hooks/reading_accessibility.py
  - hooks/class_sections.py
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - def_list
  - fenced_code
  - toc:
      permalink: false

# Guard against reintroducing raw assets removed from the publishable tree.
# Removing links alone would still copy these files into the built site.
exclude_docs: |
  assets/CCNA-Introduction-to-Networks-certificate-JKosberg.pdf
  assets/Networking-Basics-certificate-JKosberg.pdf
  assets/datacenter-inventory.png
  assets/datacenter-firewall.png
  assets/node-jhome-config.png

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Projects:
      - Projects: technical-labs/index.md
      - Proxmox homelab: technical-labs/proxmox-virtualization.md
      - SSH Workbench: technical-labs/ssh-workbench.md
      - Job scan and resume tailor: technical-labs/job-scan-tailor.md
  - Coursework:
      - Coursework: coursework/index.md
      - NETI 109 Networking I: coursework/neti-109.md
      - SVAD 111 Linux and Virtualization Technologies: coursework/svad-111.md
      - CSIA 115 Cyber Ops: coursework/csia-115.md
      - CSIA 210 Network Protocol Analysis: coursework/csia-210.md
      - CSIA 105 Introduction to Cyber Security: coursework/csia-105.md
      - SDEV 120 Computing Logic: coursework/sdev-120.md
      - AdventureWorks on AWS: technical-labs/aws-linux-infrastructure.md
      - CyberOps & traffic investigation: technical-labs/soc-threat-detection.md
      - Snort and firewall lab: technical-labs/snort-firewall-lab.md
      - IPv6 packet investigations: technical-labs/ipv6-packet-investigations.md
  - Experience: experience/index.md
  - About: credentials/index.md
